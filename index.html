            body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            }
        /* Sección de contacto */
      .contact {
    background-color: #273c75;
    padding: 40px 20px;
    color: white;
    text-align: center;
}

.contact h2 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.contact a {
    display: inline-block;
    background-color: #e84118;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    margin: 10px 0;
    transition: background 0.3s ease;
}

.contact a:hover {
    background-color: #c23616;
}

        }
        
        /* Fondo de naturaleza fijo (Parallax estático) */
        .bg-forest-fixed {
            background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2000');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }
        /* Capa semitransparente oscura para legibilidad perfecta */
        .dark-overlay {
            background-color: rgba(6, 12, 6, 0.75);
        }
        /* Efecto Glassmorphism Premium */
        .glass-panel {
            background: rgba(25, 35, 25, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #BA55D3;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        /* Identidad de Color Orquídea de Mazaventura */
        .orchid-btn {
            background-color: #BA55D3;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orchid-btn:hover {
            background-color: #9c4ab0;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(186, 85, 211, 0.3);
        }
        .orchid-text {
            color: #BA55D3;
        }
        .border-orchid {
            border-color: #BA55D3;
        }
        /* Estilos VIP Oro */
        .vip-gold-gradient {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }
        .vip-gold-text {
            color: #FFD700;
        }
        /* Animaciones suaves */
        .fade-in-view {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderView() {
            const container = document.getElementById("view-container");
            
            if (STATE.currentView === "home") {
                renderHome(container);
            } else if (STATE.currentView === "routes") {
                renderRoutesPage(container);
            } else if (STATE.currentView === "admin") {
                renderAdminPage(container);
            }
        }

        // Activación del AI Scout
        function triggerAIScout(routeId) {
            const route = ROUTES_DATA.find(r => r.id === routeId);
            if (!route) return;

            STATE.selectedRoute = route;

            const scout = document.getElementById("ai-scout-anchor");
            const promptText = document.getElementById("ai-custom-prompt");
            const checkout = document.getElementById("checkout-anchor");

            // Asegurar que ocultamos el checkout por si estaba abierto de otra ruta
            checkout.classList.add("hidden");

            scout.classList.remove("hidden");
            promptText.innerHTML = `He detectado tu interés en la ruta <strong class="orchid-text">${route.title}</strong> (${route.duration}). Como consultor inteligente, ajustaré las configuraciones del RZR en función del nivel de conducción que elijas.`;

            // Auto-scroll
            setTimeout(() => {
                scout.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }

        // Generar Itinerario y abrir Checkout
        function generateItineraryCheckout() {
            if (!STATE.selectedRoute) return;

            const paceSelect = document.getElementById("ai-difficulty-select");
            const paceText = paceSelect.options[paceSelect.selectedIndex].text;

            const checkout = document.getElementById("checkout-anchor");
            document.getElementById("chk-route-title").innerText = STATE.selectedRoute.title;
            document.getElementById("chk-route-duration").innerText = STATE.selectedRoute.duration;
            document.getElementById("chk-route-pace").innerText = paceText;
            document.getElementById("chk-route-price").innerText = `$${STATE.selectedRoute.price.toLocaleString()} MXN`;

            checkout.classList.remove("hidden");
            document.getElementById("boarding-pass").classList.add("hidden"); // Resetear ticket si cambia parámetros

            setTimeout(() => {
                checkout.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }

            STATE.notifications.unshift({

                details: `Venta Confirmada: ${STATE.selectedRoute.title} (${STATE.selectedRoute.duration})`,
                date: "Hoy, Justo ahora",
                status: "Completado"
            });

            showModal("Expedición Asegurada", `Tu pago ha sido procesado de manera segura. Presenta el Pase de Abordar QR al llegar.`);
            
            setTimeout(() => {
                bp.scrollIntoView({ behavior: 'smooth', block: 'center' });

        // Búsqueda Rápida de Notificaciones (Indexada conceptualmente en el cliente)
        function renderNotificationsTable() {
            const tableBody = document.getElementById("notifications-table-body");
            if (!tableBody) return;

            const filtered = STATE.notifications.filter(n => {
                const query = STATE.searchNotificationQuery.toLowerCase();
                return n.type.toLowerCase().includes(query) || n.details.toLowerCase().includes(query);
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = `<p class="text-xs text-gray-500 italic text-center py-4">No se encontraron registros de auditoría.</p>`;
                return;
            }

            tableBody.innerHTML = filtered.map(n => `
                <div class="p-3 bg-black/20 rounded-lg text-xs flex justify-between items-start border-l-2 ${n.type === 'Venta' ? 'border-green-500' : 'border-purple-400'}">
                    <div>
                        <div class="flex items-center gap-1.5 font-bold text-white mb-0.5">
                            <span>[${n.type}]</span>
                            <span class="text-[10px] text-gray-400">${n.date}</span>
                        </div>
                        <p class="text-gray-300">${n.details}</p>
                    </div>
                    <span class="text-[9px] bg-white/5 px-2 py-0.5 rounded text-gray-400 font-bold uppercase">${n.status}</span>
                </div>
            `).join('');
        }

        function searchNotifications(val) {
            STATE.searchNotificationQuery = val;
            renderNotificationsTable();
        }

        // Respuestas automáticas a valoraciones negativas (Estrategia de Mitigación)
        function applyAutoReply(reviewId, type) {
            const review = STATE.reviews.find(r => r.id === reviewId);
            if (!review) return;

            let answer = "";
            if (type === 'reembolso') {
                answer = `Respuesta Automática de Mazaventura enviada a ${review.author}: "Lamentamos profundamente tu insatisfacción. Hemos canalizado tu caso de inmediato y generado una cortesía de reembolso parcial. Tu satisfacción es nuestra prioridad."`;
            } else {
                answer = `Respuesta Automática de Mazaventura enviada a ${review.author}: "Agradecemos tu retroalimentación. Estudiamos detalladamente tu caso para agilizar los despachos de salida y mantener nuestra excelencia operativa."`;
            }

            // Cambiar estatus de la review
            review.status = "Atendido";
            
            // Añadir al registro de notificaciones
            STATE.notifications.unshift({
                id: Date.now(),
                type: "Mitigación",
                details: `Se atendió la queja de ${review.author} con respuesta de resolución.`,
                date: "Hoy, Justo ahora",
                status: "Completado"
            });

            showModal("Estrategia Aplicada", answer);
            renderActiveAdminTab();
        }

        // Validación de Formularios con Máxima Robustez
        function handleManualRegistration(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById("reg-email");
            const telInput = document.getElementById("reg-tel");
            
            const errEmail = document.getElementById("err-email");
            const errTel = document.getElementById("err-tel");

            // Resetear mensajes
            errEmail.classList.add("hidden");
            errTel.classList.add("hidden");
            emailInput.classList.remove("border-red-500");
            telInput.classList.remove("border-red-500");

            let isValid = true;

            // Validación de Email: No solo @, validación estricta de estructura
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                errEmail.innerText = "Ingresa un correo electrónico corporativo con formato válido (ejemplo@dominio.com)";
                errEmail.classList.remove("hidden");
                emailInput.classList.add("border-red-500");
                isValid = false;
            }

            // Validación de Teléfono: Exactamente 10 dígitos numéricos
            const telRegex = /^\d{10}$/;
            if (!telRegex.test(telInput.value.trim())) {
                errTel.innerText = "Ingresa un número telefónico válido de exactamente 10 dígitos";
                errTel.classList.remove("hidden");
                telInput.classList.add("border-red-500");
                isValid = false;
            }

            if (isValid) {
                // Agregar al registro
                STATE.notifications.unshift({
                    id: Date.now(),
                    type: "Auditoría",
                    details: `Nuevo Operador Registrado: ${emailInput.value}`,
                    date: "Hoy, Justo ahora",
                    status: "Éxito"
                });

                showModal("Registro Exitoso", `El afiliado con correo ${emailInput.value} ha sido registrado de forma correcta.`);
                e.target.reset();
                renderNotificationsTable();
            }
        }
